services:

  backend:
    build: ./backend
    ports:
      - "3009:3009"
    env_file:
      - ./backend/.env
    volumes:
      # รูปภาพเก็บที่นี่บน server — ไม่หายตอน redeploy
      - uploads_data:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # ใส่ค่านี้ใน Dokploy Environment Variables ตอน deploy จริง
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3009}
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

# Docker จัดการ volume ให้เอง — ข้อมูลอยู่ถาวรบน server
volumes:
  uploads_data:
